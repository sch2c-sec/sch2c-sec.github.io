name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.149.0"
          extended: true

      - name: Build
        run: hugo --minify

      # Pagefind 在 Hugo 产物上建索引，输出到 public/pagefind/。
      # 用 extended 版（npx 默认就是），它带中文分词；索引范围只取正文，
      # 排除代码块 .cb、目录 .toc、面包屑/元信息/标签/翻页，
      # 否则 ASCII 拓扑图和 hex dump 会占掉索引大半、污染查询。
      - name: Build search index
        run: >-
          npx -y pagefind@1.6.0 --site public
          --root-selector "article.post-single"
          --exclude-selectors ".cb, .breadcrumbs, .anchor, .post-meta, .paginav, .toc, .post-tags"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
