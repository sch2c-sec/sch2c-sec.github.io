# 搜索（Fuse.js）调参。主题默认 threshold 0.4 会让 "DNS"/"IPS"/"TLS"
# 这类短词命中全部文章（实测 4/4），0.3 收敛为精确匹配且保留拼写容错。
# minMatchCharLength 必须保持 1，否则中文单字（「包」「握」）搜不到。
# keys 去掉 permalink：URL slug 参与匹配只带来噪声。
fuseOpts:
  threshold: 0.3
  distance: 100
  ignoreLocation: true
  minMatchCharLength: 1
  limit: 10
  keys:
    - title
    - summary
    - content
